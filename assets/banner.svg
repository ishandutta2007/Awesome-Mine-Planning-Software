<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- Dynamic / Background Graphic Elements (Behind Text) -->
  <g opacity="0.25">
    <!-- Wireframe Terrain Contour Lines -->
    <path d="M 0,280 Q 300,180 600,250 T 1200,200" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 0,300 Q 350,220 700,270 T 1200,230" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 0,320 Q 250,200 500,290 T 1200,260" fill="none" stroke="#34d399" stroke-width="1.5"/>

    <!-- Open Pit Mine Wireframe Geometry (Right Background) -->
    <ellipse cx="980" cy="180" rx="180" ry="90" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 4"/>
    <ellipse cx="980" cy="190" rx="140" ry="70" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="980" cy="200" rx="100" ry="50" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <ellipse cx="980" cy="210" rx="60" ry="30" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Dynamic Animated Pulse Rings (Subtle & Background-Only) -->
  <circle cx="980" cy="190" r="130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="r" values="110;150;110" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Foreground Content Layer -->
  <!-- Header Icon / Emblem -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Pickaxe / Drill Icon SVG Paths -->
    <path d="M 18,42 L 42,18 M 34,14 L 46,26 M 22,18 C 26,14 36,12 44,14 C 42,22 40,32 36,36" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="160" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)">
    Awesome Mine Planning Software ⛏️ 💎
  </text>

  <!-- Subtitle -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">
    The Ultimate Curated Ecosystem of Commercial &amp; Open-Source Mining Technology
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(80, 185)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="210" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">
      🌋 Geological Modelling
    </text>

    <!-- Pill 2 -->
    <rect x="225" y="0" width="200" height="34" rx="17" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="325" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">
      📐 Mine Design &amp; Pits
    </text>

    <!-- Pill 3 -->
    <rect x="440" y="0" width="200" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="540" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">
      🚀 Scheduling &amp; NPV
    </text>

    <!-- Pill 4 -->
    <rect x="655" y="0" width="210" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="760" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a855f7" text-anchor="middle">
      ⚡ Open-Source Stack
    </text>
  </g>

  <!-- Footer Tagline -->
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
    GemPy • MiningPy • PyGSLIB • Pyomo • QGIS • PyVista • Deswik • Datamine • Vulcan • Surpac • Micromine
  </text>
</svg>
